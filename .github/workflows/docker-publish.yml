name: docker

# 只在 main 的代码变更上构建：文档改动不跑，tag 也不单独跑（本项目不靠版本 tag 发版）。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.dockerignore'

# 同一分支连推时取消上一次，避免排队跑过期提交
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1) 基座镜像：Chrome + CDP + noVNC + opencli CLI
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      # 2) MCP 层：在本次刚构建的基座之上加 opencli-mcp（4 个 MCP 工具）
      #    用 sha tag 作 base，保证两层严格对应同一次运行
      - uses: docker/build-push-action@v5
        with:
          context: mcp
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:mcp
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:mcp-sha-${{ github.sha }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max
